name: Validate platform contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate registry, manifests, and policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.6"

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Validate registry schema
        run: python3 scripts/validate-registry.py

      - name: Run regression tests
        run: python3 -m pytest -q

      - name: Format and validate OpenTofu
        run: |
          tofu fmt -check -recursive terraform
          tofu -chdir=terraform init -backend=false -input=false
          tofu -chdir=terraform validate

      - name: Render Helm charts and enforce policies
        run: scripts/render-and-check-policies.sh
