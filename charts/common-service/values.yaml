replicaCount: 1

image:
  repository: python
  tag: "3.12.10-alpine3.21"
  pullPolicy: IfNotPresent

command:
  - python
  - /app/server.py

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 256Mi

labels: {}

vault:
  enabled: false
  authRef: default
  environment: ""
  project: ""
  service: ""
  pathPrefixes:
    - secrets
    - configurations

database:
  enabled: false
  name: ""
  secretName: postgres-app
  host: platform-postgres-rw.cnpg-system
  port: "5432"
