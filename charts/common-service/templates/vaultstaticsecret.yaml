{{- if .Values.vault.enabled }}
{{- range .Values.vault.pathPrefixes }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $.Release.Name }}-{{ . }}-demo
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- with $.Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  vaultAuthRef: {{ $.Values.vault.authRef | quote }}
  type: kv-v2
  mount: {{ . | quote }}
  path: {{ printf "%s/%s-%s/demo" $.Values.vault.environment $.Values.vault.project $.Values.vault.service | quote }}
  refreshAfter: 30s
  destination:
    name: {{ printf "%s-%s-demo" $.Release.Name . | quote }}
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ $.Release.Name }}
{{- end }}
{{- end }}
