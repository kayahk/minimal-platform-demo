kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30200
        hostPort: 8200
        protocol: TCP
      # Argo CD UI: NodePort 30080 -> localhost:8081
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
